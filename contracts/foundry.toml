[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Mezo supports PUSH0, so the shanghai target used for GIWA / BSC works unchanged.
evm_version = "shanghai"

[fmt]
line_length = 110
tab_width = 4

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"

# Blockscout (the Mezo API host differs from the explorer UI host)
[etherscan]
mezo_testnet = { key = "blockscout", url = "https://api.explorer.test.mezo.org/api", chain = 31611 }
